# Push a tag like v1.0.1 → GitHub builds the Windows installer and attaches it to a Release.
# latest.yml + the .blockmap are what installed apps check for updates (electron-updater). The newest one is always at https://github.com/AllForWife/kroomapp/releases/latest/download/KRoom-Setup.exe
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js # (newer npm may skip electron's own download script)
      - run: npm run release
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # a tag with a dash (v1.0.4-beta.1) is a beta: published as a pre-release, which installed normal versions never update to
        # (a beta install follows newer betas and normal releases: main.js allowPrerelease)
        run: |
          PRE=(); NOTE=""
          case "$GITHUB_REF_NAME" in *-*) PRE=(--prerelease); NOTE="🧪 測試版：只給測試用，已安裝的一般版本不會自動更新到這裡。 " ;; esac
          gh release create "$GITHUB_REF_NAME" dist/KRoom-Setup.exe dist/KRoom-Setup.exe.blockmap dist/latest.yml dist/KRoom-win-x64.zip "${PRE[@]}" \
            --title "K ROOM for Windows $GITHUB_REF_NAME" \
            --notes "${NOTE}下載 **KRoom-Setup.exe** 安裝（一般使用者帳號就能安裝）；或下載 zip 解壓後執行「K ROOM.exe」。第一次執行 Windows 可能顯示 SmartScreen 警告：按「其他資訊 → 仍要執行」。"
