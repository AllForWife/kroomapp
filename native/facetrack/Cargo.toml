[package]
name = "kroom-facetrack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
nalgebra = "0.33"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }   # (不要 mozjpeg：MJPEG 用 image 的純 Rust 解碼，才能交叉編譯)
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
libloading = "0.8"

# ONNX Runtime 的 GPU：Mac 用 CoreML、Windows 用 DirectML（預先編好的版本一次只能選一種）
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-22", "coreml"] }

[target.'cfg(windows)'.dependencies.ort]
version = "2.0.0-rc.15"
default-features = false
features = ["std", "ndarray", "load-dynamic", "api-22", "directml"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
